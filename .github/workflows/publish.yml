name: Build and Publish

on:
  push:
    branches: [ "actions" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up Java 24
      - name: Set up JDK 24
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 24

      # 3️⃣ Import GPG key
      - name: Import GPG private key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-keys

      - name: Write Maven settings.xml from secret
        run: |
          mkdir -p ~/.m2
          echo "${{ secrets.MAVEN_SETTINGS_XML }}" > ~/.m2/settings.xml

      # 5️⃣ Build, sign, and deploy artifacts to OSSRH
      - name: Build and deploy to Sonatype OSSRH
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn clean deploy -DskipTests -P sign-artifacts \
              -Dgpg.executable=gpg \
              -Dgpg.passphrase="$GPG_PASSPHRASE"

