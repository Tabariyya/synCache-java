name: Build and Publish

on:
  push:
    branches:
      - development
    paths:
      - 'pom.xml'

jobs:
  build-and-publish:
    runs-on: self-hosted

    steps:
      - name: Checkout code (with LFS)
        uses: actions/checkout@v3
        with:
          lfs: true
          fetch-depth: 2

      - name: Check if version changed
        id: version-check
        run: |
          OLD=$(git show HEAD~1:pom.xml | python3 -c "
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.stdin).getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(root.find('m:version', ns).text)
          ")
          NEW=$(python3 -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(root.find('m:version', ns).text)
          ")
          echo "old=$OLD, new=$NEW"
          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build and deploy via Docker
        if: steps.version-check.outputs.changed == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
        run: |
          docker run --rm \
            -v "$PWD":/app \
            -w /app \
            -e GPG_PRIVATE_KEY \
            -e GPG_PASSPHRASE \
            -e MAVEN_SETTINGS_XML \
            maven:3.9-eclipse-temurin-8 \
            bash -c '
              apt-get update -q && apt-get install -y -q gnupg &&
              echo "$GPG_PRIVATE_KEY" | gpg --batch --import &&
              mkdir -p ~/.m2 && printf "%s" "$MAVEN_SETTINGS_XML" > ~/.m2/settings.xml &&
              mvn clean deploy -DskipTests -Prelease -Dgpg.passphrase="$GPG_PASSPHRASE"
            '
